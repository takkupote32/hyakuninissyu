<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>五色百人一首 かるた対戦</title>
<style>
:root{
  --bg:#0d1420; --line:rgba(255,255,255,.10);
  --gold:#d9b46a; --ink:#f3efe6; --dim:#96a2b8;
  --c-base:#2f6fb3; --c-dark:#16416f; --c-ink:#fff;
  --fs:clamp(12px, 2.8vw, 20px); --radius:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;}
body{
  background:radial-gradient(125% 85% at 50% -10%, #1d2a44 0%, var(--bg) 58%, #06090f 100%);
  color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,-apple-system,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  font-feature-settings:"palt" 0;
}
.screen{display:none;height:100svh;height:100dvh;width:100%;flex-direction:column;}
.screen.on{display:flex;}

/* ===== 設定画面 ===== */
#setup{
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  gap:12px;overflow-y:auto;width:100%;height:100%;
}
.brand{text-align:center;padding:4px 0 2px;}
.brand h1{margin:0;font-size:clamp(30px, 4.8vw, 42px);letter-spacing:.20em;font-weight:700;
  background:linear-gradient(180deg,#f8ecc9 0%,#d9b46a 55%,#a8823f 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.brand p{margin:4px 0 0;font-size:clamp(14px, 2.2vw, 18px);color:var(--dim);letter-spacing:.14em;}
.sec{margin-top:6px;}
.sec>h2{font-size:clamp(15px, 2.2vw, 20px);color:var(--gold);letter-spacing:.16em;margin:12px 0 8px;font-weight:600;}
.sec>h2 small{color:var(--dim);letter-spacing:0;font-weight:400;margin-left:8px;font-size:clamp(12px, 1.8vw, 16px);}
.colors{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.cbtn{
  border:0;border-radius:var(--radius);padding:14px 0 12px;cursor:pointer;
  color:#fff;font-family:inherit;font-size:clamp(16px, 2.4vw, 21px);font-weight:700;letter-spacing:.1em;
  box-shadow:0 3px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.32);
  position:relative;transition:transform .12s, outline-color .12s;
  outline:3px solid transparent;outline-offset:2px;
}
.cbtn:active{transform:translateY(2px);}
.cbtn .cnt{display:block;font-size:clamp(10.5px, 1.5vw, 14px);opacity:.85;letter-spacing:0;margin-top:3px;font-weight:500;}
.cbtn.sel{outline-color:var(--gold);}
.diffs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.dbtn{
  border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--ink);
  border-radius:var(--radius);padding:12px 2px;font-family:inherit;font-size:clamp(13.5px, 1.9vw, 18px);font-weight:600;
  cursor:pointer;letter-spacing:.02em;transition:all .15s;
}
.dbtn span{display:block;font-size:clamp(10px, 1.4vw, 14px);color:var(--dim);font-weight:400;margin-top:3px;}
.dbtn.sel{background:linear-gradient(180deg,rgba(217,180,106,.30),rgba(217,180,106,.13));
  border-color:var(--gold);color:#f8ecc9;}
.dbtn.sel span{color:#d9c39a;}
.note{
  font-size:clamp(13px, 1.8vw, 16px);color:#c8bfa8;background:rgba(217,180,106,.09);
  border-left:2px solid var(--gold);border-radius:0 6px 6px 0;padding:10px 14px;margin-top:8px;line-height:1.5;
}
.opts{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
.chk,.rdo{
  display:flex;align-items:center;gap:6px;font-size:clamp(13px, 1.8vw, 16px);color:#cfd6e2;
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:20px;padding:9px 16px;cursor:pointer;
}
.chk.on,.rdo.on{background:rgba(217,180,106,.18);border-color:rgba(217,180,106,.5);color:#f4e6c6;}
.chk input,.rdo input{display:none;}
#startBtn{
  margin-top:18px;width:100%;border:0;border-radius:12px;padding:18px;font-family:inherit;
  font-size:clamp(18px, 2.6vw, 24px);font-weight:700;letter-spacing:.2em;color:#251c07;cursor:pointer;
  background:linear-gradient(180deg,#f2dda6,#d9b46a 60%,#bb9247);
  box-shadow:0 5px 16px rgba(217,180,106,.28), inset 0 1px 0 rgba(255,255,255,.7);
}
#startBtn:active{transform:translateY(2px);}
.ghost{
  margin-top:10px;width:100%;border:1px solid var(--line);background:transparent;color:var(--dim);
  border-radius:10px;padding:14px;font-family:inherit;font-size:clamp(13px, 1.8vw, 16px);cursor:pointer;
}

/* 履歴セクション */
.history-sec{margin-top:16px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:14px;}
.history-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.history-hdr h3{margin:0;font-size:clamp(14px, 1.9vw, 17px);color:var(--gold);font-weight:600;}
.clear-btn{border:1px solid rgba(255,107,107,.4);background:rgba(255,107,107,.1);color:#ff9f6b;border-radius:12px;padding:4px 12px;font-size:clamp(11.5px, 1.5vw, 14px);cursor:pointer;}
.hist-list{display:flex;flex-direction:column;gap:8px;max-height:200px;overflow-y:auto;}
.hist-item{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:10px;font-size:clamp(12px, 1.6vw, 15px);padding:8px 12px;background:rgba(255,255,255,.04);border-radius:6px;border:1px solid rgba(255,255,255,.05);}
.hist-item .win{color:#7de08a;font-weight:700;}
.hist-item .lose{color:#ff6b6b;font-weight:700;}
.hist-item .draw{color:var(--dim);font-weight:700;}
.hist-del{border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:14px;padding:0 4px;}

/* ===== 対戦画面 ===== */
#game{
  padding:calc(6px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));
  gap:6px;height:100svh;height:100dvh;width:100%;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;
}
.hud{
  display:grid;grid-template-columns:auto 1fr auto 1fr;align-items:center;gap:10px;
  font-size:clamp(11px, 1.6vw, 15px);padding:2px 6px;flex:0 0 auto;
}
.hud .quit-btn{
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--dim);
  border-radius:16px;padding:5px 12px;font-size:clamp(10px, 1.4vw, 13px);cursor:pointer;font-family:inherit;
  white-space:nowrap;transition:background .15s;
}
.hud .quit-btn:active{background:rgba(255,255,255,.18);color:#fff;}
.hud .side{display:flex;align-items:center;gap:6px;color:var(--dim);}
.hud .side.r{justify-content:flex-end;}
.hud b{font-size:clamp(15px, 2.2vw, 22px);color:var(--ink);font-variant-numeric:tabular-nums;}
.hud b.hot{color:#ff9f6b;}
.hud .diff-tag{
  font-size:clamp(9.5px, 1.3vw, 13px);color:var(--gold);background:rgba(217,180,106,.15);
  border:1px solid rgba(217,180,106,.35);border-radius:4px;padding:2px 7px;
  font-weight:600;white-space:nowrap;line-height:1.2;
}

.rest-tag{
  font-size:clamp(10px, 1.4vw, 14px);color:#ff4d4d;background:rgba(255,77,77,.18);
  border:1px solid rgba(255,77,77,.6);border-radius:4px;padding:2px 8px;
  font-weight:700;white-space:nowrap;line-height:1.2;animation:pulseRest 1.2s infinite alternate;
}
@keyframes pulseRest{
  0%{transform:scale(1);box-shadow:0 0 2px rgba(255,77,77,.4);}
  100%{transform:scale(1.05);box-shadow:0 0 8px rgba(255,77,77,.8);}
}

.hud .mid{
  font-size:clamp(10.5px, 1.5vw, 14px);color:var(--gold);letter-spacing:.06em;text-align:center;
  border:1px solid rgba(217,180,106,.35);border-radius:20px;padding:4px 12px;white-space:nowrap;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.hud .pot-info{font-size:clamp(9px, 1.3vw, 12px);color:#ff9f6b;margin-top:1px;font-weight:700;}

.field{
  display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);
  gap:8px;flex:1 1 0;min-height:0;width:100%;align-items:stretch;justify-items:stretch;
}
.field.cpu{transform:rotate(180deg);}

.slot{
  width:100%;height:100%;min-height:0;position:relative;
}
.card{
  position:absolute;inset:0;border:0;padding:2px 3px;border-radius:8px;overflow:hidden;cursor:pointer;
  background:linear-gradient(160deg,var(--c-base),var(--c-dark));
  box-shadow:0 3px 8px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;
  font-family:inherit;transition:transform .1s, box-shadow .15s, opacity .25s;
}
.card::after{content:"";position:absolute;inset:3px;border-radius:6px;
  border:1px solid rgba(255,255,255,.18);pointer-events:none;}
.card .num{
  position:absolute;left:4px;top:3px;font-size:clamp(8px, 1.0vw, 11px);color:var(--c-ink);opacity:.6;
  line-height:1;letter-spacing:0;
}

.card .shimo{
  writing-mode:vertical-rl;
  -webkit-writing-mode:vertical-rl;
  color:var(--c-ink);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  height:100%;
  width:100%;
  box-sizing:border-box;
}

.card .shimo .line{
  display:inline-block;
  white-space:nowrap;
  font-size:clamp(9.5px, 1.8vh, 17px);
  line-height:1.15;
  letter-spacing:0.02em;
  font-weight:700;
  text-align:center;
}

.slot.taken .card{display:none;}
.slot.taken::before{
  content:"";position:absolute;inset:0;border-radius:8px;
  border:1.5px dashed rgba(255,255,255,.12);background:rgba(0,0,0,.15);
}

.card:active:not(.empty){transform:scale(.95);}
.card.hit{animation:hit .45s ease-out;box-shadow:0 0 0 4px #7de08a, 0 0 25px rgba(125,224,138,.8);}
.card.bad{animation:bad .45s ease-out;box-shadow:0 0 0 4px #ff6b6b, 0 0 25px rgba(255,107,107,.8);}
.card.dim{opacity:.25;}
@keyframes hit{0%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes bad{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.card.nonum .num{display:none;}

.reader{
  flex:0 0 auto;border-radius:12px;padding:8px 14px;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.028));
  border:1px solid var(--line);min-height:80px;
  display:flex;flex-direction:column;justify-content:center;gap:3px;position:relative;overflow:hidden;
}
.reader .lbl{font-size:clamp(8.5px, 1.2vw, 12px);color:var(--dim);letter-spacing:.32em;}
.reader .kami{font-size:clamp(14.5px, 2.2vw, 22px);font-weight:600;letter-spacing:.06em;line-height:1.45;word-break:break-all;}
.reader .sub{font-size:clamp(10px, 1.5vw, 14px);color:#8fa8c4;letter-spacing:.05em;min-height:16px;line-height:1.3;transition:opacity .3s;}
.reader.hide .kami{filter:blur(7px);opacity:.55;}
.reader.done .kami{color:var(--gold);}
.reader .rep{position:absolute;right:10px;top:8px;border:1px solid var(--line);background:rgba(255,255,255,.07);
  color:#cbd4e2;border-radius:16px;font-family:inherit;font-size:clamp(9px, 1.3vw, 12px);padding:4px 10px;cursor:pointer;letter-spacing:.02em;}
.reader .rep:active{transform:scale(.94);}
.reader .rep[disabled]{opacity:.3;}
.bar{position:absolute;left:0;bottom:0;height:4px;width:100%;background:rgba(255,255,255,.09);}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7de08a,#d9b46a,#ff6b6b);
  transform-origin:left center;transform:scaleX(1);}

.memo-bar{
  position:absolute;inset:0;margin:auto;
  width:clamp(240px, 70%, 400px);height:calc(100% - 10px);
  background:rgba(13,20,32,0.96);border:1.5px solid var(--gold);
  border-radius:12px;padding:6px 16px;display:none;align-items:center;justify-content:space-between;
  z-index:10;backdrop-filter:blur(6px);box-shadow:0 4px 20px rgba(0,0,0,0.6);
}
.memo-bar.on{display:flex;}
.memo-bar .time{font-size:clamp(22px, 3.5vw, 32px);font-weight:700;color:#f8ecc9;font-variant-numeric:tabular-nums;line-height:1;}
.memo-bar .txt{font-size:clamp(10.5px, 1.6vw, 15px);color:var(--dim);line-height:1.2;text-align:left;}
.memo-bar .btn{
  border:0;border-radius:8px;padding:6px 14px;font-family:inherit;font-size:clamp(10.5px, 1.6vw, 15px);font-weight:700;
  color:#251c07;background:linear-gradient(180deg,#f2dda6,#d9b46a);cursor:pointer;white-space:nowrap;
}

.toast{
  position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.85);
  background:rgba(8,12,20,.95);border:1px solid var(--gold);color:#fff;padding:14px 26px;border-radius:14px;
  font-size:clamp(13px, 2vw, 18px);font-weight:700;letter-spacing:.08em;opacity:0;pointer-events:none;transition:all .2s;z-index:95;
  white-space:nowrap;backdrop-filter:blur(6px);text-align:center;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.6);
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

/* ===== 対戦結果ポップアップ ===== */
.modal-ov{
  position:fixed;inset:0;background:rgba(4,7,12,0.85);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-ov.on{display:flex;}
.modal-box{
  background:linear-gradient(180deg,#18253d,#0d1420);border:1.5px solid var(--gold);
  border-radius:24px;padding:28px 24px;width:100%;max-width:420px;text-align:center;
  box-shadow:0 12px 32px rgba(0,0,0,.8);animation:modalUp .3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
}
@keyframes modalUp{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal-box .verdict{
  font-size:clamp(36px, 5vw, 48px);font-weight:800;letter-spacing:.15em;margin-bottom:6px;
  background:linear-gradient(180deg,#f8ecc9,#d9b46a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.modal-box .why{font-size:clamp(11.5px, 1.7vw, 16px);color:var(--dim);margin-bottom:18px;line-height:1.5;}
.scorebox{
  display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:18px;
}
.scorebox .n{font-size:clamp(30px, 4.5vw, 40px);font-weight:700;font-variant-numeric:tabular-nums;}
.scorebox .t{font-size:clamp(10px, 1.5vw, 14px);color:var(--dim);margin-top:2px;}
.scorebox .vs{font-size:clamp(10px, 1.6vw, 15px);color:var(--gold);font-weight:700;}
.modal-btns{display:flex;flex-direction:column;gap:10px;}
.modal-btn-main{
  border:0;border-radius:12px;padding:14px;font-family:inherit;font-size:clamp(14px, 2vw, 18px);font-weight:700;
  color:#251c07;background:linear-gradient(180deg,#f2dda6,#d9b46a);cursor:pointer;letter-spacing:.1em;
}
.modal-btn-sub{
  border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);
  border-radius:12px;padding:12px;font-family:inherit;font-size:clamp(12px, 1.7vw, 15px);cursor:pointer;
}

.ov{position:fixed;inset:0;background:rgba(5,8,13,.93);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:80;padding:24px;text-align:center;}
.ov.on{display:flex;}
.spin{width:48px;height:48px;border-radius:50%;border:4px solid rgba(217,180,106,.22);
  border-top-color:var(--gold);animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ========== 設定 ========== -->
<section id="setup" class="screen on">
  <div class="brand">
    <h1>五色百人一首</h1>
    <p>かるた対戦</p>
  </div>

  <div class="sec">
    <h2>色を選ぶ <small>20枚 ずつ</small></h2>
    <div class="colors" id="colorpick"></div>
  </div>

  <div class="sec">
    <h2>相手の強さ</h2>
    <div class="diffs" id="diffpick"></div>
    <div class="note" id="diffNote"></div>
  </div>

  <div class="sec">
    <h2>読み手の声</h2>
    <div class="opts">
      <label class="rdo on" id="rdoVoiceFem"><input type="radio" name="vGender" value="female" checked>女性の声</label>
      <label class="rdo" id="rdoVoiceMale"><input type="radio" name="vGender" value="male">男性の声（録音ファイル）</label>
      <label class="rdo" id="rdoVoiceAuto"><input type="radio" name="vGender" value="auto">自動・標準</label>
    </div>
  </div>

  <div class="sec">
    <h2>表示・設定</h2>
    <div class="opts">
      <label class="chk" id="chkNum"><input type="checkbox" id="cbNum">札に番号を表示</label>
      <label class="chk on" id="chkKami"><input type="checkbox" id="cbKami" checked>上の句を表示</label>
      <label class="chk on" id="chkVoice"><input type="checkbox" id="cbVoice" checked>音声で読み上げ</label>
      <label class="chk" id="chkSlow"><input type="checkbox" id="cbSlow">ゆっくり詠む</label>
    </div>
  </div>

  <!-- 対戦履歴 -->
  <div class="history-sec">
    <div class="history-hdr">
      <h3>対戦履歴（最新10件）</h3>
      <button class="clear-btn" id="clearHistBtn">全リセット</button>
    </div>
    <div class="hist-list" id="histList">
      <div style="font-size:12px;color:var(--dim);text-align:center;padding:10px;">履歴はありません</div>
    </div>
  </div>

  <button id="startBtn">対 戦 ス タ ー ト</button>
  <button id="voiceTest" class="ghost">🔊 読み上げの音声テスト</button>
</section>

<!-- ========== 対戦 ========== -->
<section id="game" class="screen">
  <div class="hud">
    <button class="quit-btn" id="quitBtn">✕ 中断</button>
    <div class="side">
      <span>相手</span> <b id="cpuCount">0</b><span>枚</span>
      <span class="diff-tag" id="hudDiff">中位</span>
      <span class="rest-tag" id="cpuRestTag" style="display:none;">1回休み</span>
    </div>
    <div class="mid">
      <span id="phaseText">準備</span>
      <span id="potText" class="pot-info"></span>
    </div>
    <div class="side r">
      <span class="rest-tag" id="myRestTag" style="display:none;">1回休み</span>
      <span>自分</span> <b id="myCount" class="hot">0</b><span>枚</span>
    </div>
  </div>

  <div class="field cpu" id="cpuField"></div>

  <div class="reader" id="reader">
    <div class="lbl">上 の 句</div>
    <div class="kami" id="kamiText">―</div>
    <div class="sub" id="subText"></div>
    <button class="rep" id="replayBtn" aria-label="もう一度聞く">↻ もう一度</button>
    <div class="bar"><i id="barFill"></i></div>

    <div class="memo-bar" id="memoBar">
      <div class="time" id="memoNum">60</div>
      <div class="txt">札の場所を<br>覚えよう！</div>
      <button class="btn" id="memoSkip">覚えた！</button>
    </div>
  </div>

  <div class="field me" id="myField"></div>
</section>

<!-- 対戦結果ポップアップ -->
<div class="modal-ov" id="resultModal">
  <div class="modal-box">
    <div class="verdict" id="mVerdict">勝利！</div>
    <div class="why" id="mWhy">17首終了時、獲得枚数が多いため勝利しました！</div>
    <div class="scorebox">
      <div><div class="n" id="mMy">0</div><div class="t">自分</div></div>
      <div class="vs">VS</div>
      <div><div class="n" id="mCpu">0</div><div class="t">相手</div></div>
    </div>
    <div class="modal-btns">
      <button class="modal-btn-main" id="mAgainBtn">もう一度対戦</button>
      <button class="modal-btn-sub" id="mBackBtn">設定画面に戻る</button>
    </div>
  </div>
</div>

<div class="ov" id="readyOv">
  <div class="spin"></div>
  <div style="font-size:12px;color:var(--dim);margin-top:10px;">札を並べています…</div>
</div>

/* ===== 朗詠音声の管理 ===== */
let speakTimers=[];
let currentSpeakId=0;
let currentAudio=null; // 音声ファイル再生用

// ★ 男性の声（録音MP3ファイル）のディレクトリ設定
const AUDIO_DIR = "./audio/";

function getVoiceByGender(gender){
  if(!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices() || [];
  const ja = vs.filter(v => /^ja/i.test(v.lang || ''));
  if(!ja.length) return null;

  const femaleKeys = ['Kyoko', 'Google 日本語', 'Nanami', 'Ayumi', 'Haruka', 'O-ren', 'Aoi', 'Mayu', 'Sakura'];
  const maleKeys   = ['Otoya', 'Hattori', 'Ichiro', 'Keita', 'Naoki', 'Takumi'];

  if(gender === 'female'){
    return ja.find(v => femaleKeys.some(k => (v.name||'').includes(k))) || ja[0];
  }else if(gender === 'male'){
    return ja.find(v => femaleKeys.some(k => (v.name||'').includes(k))) || ja.find(v => !(femaleKeys.some(k => (v.name||'').includes(k)))) || ja[0];
  }
  return ja.find(v => femaleKeys.concat(maleKeys).some(k => (v.name||'').includes(k))) || ja[0];
}

if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = () => {
    getVoiceByGender(S.opts.voiceGender);
  };
}

function warmup(){
  if(!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.resume();
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    u.lang = 'ja-JP';
    speechSynthesis.speak(u);
  } catch(e) {}
}

function stopSpeak(){
  currentSpeakId++;
  speakTimers.forEach(t => clearTimeout(t));
  speakTimers = [];
  
  if(currentAudio){
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
  
  if('speechSynthesis' in window){
    try{speechSynthesis.cancel();}catch(e){}
  }
}

function speakPoem(poem, onEndCallback){
  stopSpeak();
  const speakId = currentSpeakId;

  if(!S.opts.voice){
    S.speechEnded = true;
    if(onEndCallback) onEndCallback();
    return;
  }

  // ★「男性の声」が選択されている場合、指定フォルダのMP3ファイルを実行再生
  if(S.opts.voiceGender === 'male'){
    S.speechEnded = false;
    
    // 歌番号（例: 3 -> "003.mp3" / "3.mp3" 両対応できるよう整形）
    // ファイル名が 001.mp3〜100.mp3 の場合の例
    const numStr = String(poem.n).padStart(3, '0');
    const audioPath = AUDIO_DIR + numStr + ".mp3";
    
    currentAudio = new Audio(audioPath);
    if(S.opts.slow) {
      currentAudio.playbackRate = 0.85; // ゆっくり詠む時の再生速度
    }

    currentAudio.onended = () => {
      if(currentSpeakId !== speakId) return;
      subText.textContent = '下の句 ' + poem.s[0] + ' ' + poem.s[1];
      subText.style.opacity = '1';
      S.speechEnded = true;
      if(onEndCallback && currentSpeakId === speakId) onEndCallback();
    };

    currentAudio.onerror = (e) => {
      console.warn("音声ファイルが見つからないか再生できません:", audioPath);
      // MP3が見つからない場合は自動でスキップ進行させて進行を止めない
      S.speechEnded = true;
      if(onEndCallback && currentSpeakId === speakId) onEndCallback();
    };

    currentAudio.play().catch(err => {
      console.warn("再生がブロックされました:", err);
      S.speechEnded = true;
      if(onEndCallback && currentSpeakId === speakId) onEndCallback();
    });

    return;
  }

  // ★「女性の声」または「自動」の場合はブラウザ合成音声を使用
  try {
    const dummyUttr = new SpeechSynthesisUtterance('');
    speechSynthesis.speak(dummyUttr);
  } catch(e) {}

  S.speechEnded = false;
  const baseRate = S.opts.slow ? 0.62 : 0.72;
  const targetVoice = getVoiceByGender(S.opts.voiceGender);

  let isMaleFallback = (S.opts.voiceGender === 'male' && targetVoice && !(['Otoya','Ichiro','Keita','Hattori','Takumi'].some(k=>(targetVoice.name||'').includes(k))));
  const pitchBase = isMaleFallback ? 0.75 : 1.0;

  const speakKamiPart = (index) => {
    if(currentSpeakId !== speakId) return;

    if(index >= 3){
      subText.textContent = '下の句 ' + poem.s[0] + ' ' + poem.s[1];
      subText.style.opacity = '1';
      const t = setTimeout(()=>{
        if(currentSpeakId === speakId) speakShimoPart(0);
      }, 700);
      speakTimers.push(t);
      return;
    }

    const phraseText = poem.k[index] + '、';
    const u = new SpeechSynthesisUtterance(phraseText);
    u.lang = 'ja-JP';
    u.rate = baseRate;
    u.pitch = pitchBase + (0.05 * (1 - index * 0.5));
    u.volume = 1;
    if(targetVoice) u.voice = targetVoice;

    u.onend = ()=>{
      if(currentSpeakId !== speakId) return;
      const t = setTimeout(()=>{
        if(currentSpeakId === speakId) speakKamiPart(index + 1);
      }, 450);
      speakTimers.push(t);
    };
    try { speechSynthesis.speak(u); } catch(e){}
  };

  const speakShimoPart = (index) => {
    if(currentSpeakId !== speakId) return;

    if(index >= 2){
      S.speechEnded = true;
      if(onEndCallback && currentSpeakId === speakId) onEndCallback();
      return;
    }

    const phraseText = poem.s[index] + (index === 1 ? '。' : '、');
    const u = new SpeechSynthesisUtterance(phraseText);
    u.lang = 'ja-JP';
    u.rate = baseRate * 0.90;
    u.pitch = pitchBase - (index * 0.04);
    u.volume = 1;
    if(targetVoice) u.voice = targetVoice;

    u.onend = ()=>{
      if(currentSpeakId !== speakId) return;
      if(index === 0){
        const t = setTimeout(()=>{
          if(currentSpeakId === speakId) speakShimoPart(1);
        }, 500);
        speakTimers.push(t);
      }else{
        S.speechEnded = true;
        if(onEndCallback && currentSpeakId === speakId) onEndCallback();
      }
    };
    try { speechSynthesis.speak(u); } catch(e){}
  };

  speakKamiPart(0);
}

/* ===== 対戦履歴 ===== */
function getHistory(){
  try{ return JSON.parse(localStorage.getItem('karuta_hist')||'[]'); }catch(e){ return []; }
}
function saveHistoryItem(item){
  const list = getHistory();
  list.unshift(item);
  if(list.length > 10) list.pop();
  try{ localStorage.setItem('karuta_hist', JSON.stringify(list)); }catch(e){}
  renderHistory();
}
function deleteHistoryItem(idx){
  const list = getHistory();
  list.splice(idx,1);
  try{ localStorage.setItem('karuta_hist', JSON.stringify(list)); }catch(e){}
  renderHistory();
}
function clearHistory(){
  try{ localStorage.removeItem('karuta_hist'); }catch(e){}
  renderHistory();
}
function renderHistory(){
  const list = getHistory();
  if(!list.length){
    histList.innerHTML = '<div style="font-size:12px;color:var(--dim);text-align:center;padding:10px;">履歴はありません</div>';
    return;
  }
  histList.innerHTML = list.map((item, i)=>{
    const resClass = item.res === 'WIN' ? 'win' : (item.res === 'LOSE' ? 'lose' : 'draw');
    const resText = item.res === 'WIN' ? '勝利' : (item.res === 'LOSE' ? '敗北' : '引分');
    return `<div class="hist-item">
      <div><b>${item.color}</b> <small style="color:var(--dim)">(${item.diff})</small> <br><span style="font-size:10px;color:var(--dim);">${item.date}</span></div>
      <div class="${resClass}">${resText}</div>
      <div style="font-weight:700;">${item.my} - ${item.cpu}</div>
      <button class="hist-del" onclick="deleteHistoryItem(${i})">✕</button>
    </div>`;
  }).join('');
}
clearHistBtn.addEventListener('click', ()=>{
  if(confirm('対戦履歴を全リセットしますか？')) clearHistory();
});

/* ===== 設定画面の初期化 ===== */
function selectColor(c){
  S.color=c;
  [...colorPick.children].forEach(b=>b.classList.toggle('sel',b.dataset.id===c.id));
  document.documentElement.style.setProperty('--c-base',c.base);
  document.documentElement.style.setProperty('--c-dark',c.dark);
  document.documentElement.style.setProperty('--c-ink',c.ink);
}
function selectDiff(d){
  S.diff=d;
  [...diffPick.children].forEach(b=>b.classList.toggle('sel',b.dataset.id===d.id));
  diffNote.textContent=d.note;
}
COLORS.forEach(c=>{
  const b=document.createElement('button');
  b.className='cbtn';b.dataset.id=c.id;
  b.style.background='linear-gradient(170deg,'+c.base+','+c.dark+')';
  b.innerHTML=c.name+'<span class="cnt">20首</span>';
  b.addEventListener('click',()=>selectColor(c));
  colorPick.appendChild(b);
});
DIFFS.forEach(d=>{
  const b=document.createElement('button');
  b.className='dbtn';b.dataset.id=d.id;
  b.innerHTML=d.name+'<span>'+d.sub+'</span>';
  b.addEventListener('click',()=>{selectDiff(d);warmup();});
  diffPick.appendChild(b);
});
selectColor(COLORS[0]);selectDiff(DIFFS[1]);renderHistory();

document.querySelectorAll('input[name="vGender"]').forEach(r => {
  r.addEventListener('change', (e) => {
    S.opts.voiceGender = e.target.value;
    document.querySelectorAll('.rdo').forEach(l => l.classList.remove('on'));
    e.target.parentElement.classList.add('on');
  });
});

const chk=(id,key,elId)=>{
  const box=$(elId),wrap=$(id);
  box.checked=S.opts[key];
  wrap.classList.toggle('on',box.checked);
  box.addEventListener('change',()=>{S.opts[key]=box.checked;wrap.classList.toggle('on',box.checked);});
};
chk('chkNum','num','cbNum');
chk('chkKami','kami','cbKami');
chk('chkVoice','voice','cbVoice');
chk('chkSlow','slow','cbSlow');

voiceTest.addEventListener('click',()=>{
  warmup();
  const sample = {n:3, k:['あしびきの','やまどりのをの','しだりをの'],s:['ながながしよを','ひとりかもねむ']};
  speakPoem(sample, null);
  if(S.opts.voiceGender === 'male'){
    voiceTest.textContent = '🔊 音声テスト（男性: ローカルMP3再生）';
  } else {
    const v = getVoiceByGender(S.opts.voiceGender);
    voiceTest.textContent = v ? ('🔊 音声テスト（' + v.name + '）') : '🔊 音声テスト（日本語音声未検出）';
  }
});

/* ===== フィールド描画 ===== */
function slotHTML(slotData, own, index){
  if(!slotData || slotData.taken){
    return `<div class="slot taken" data-idx="${index}" data-own="${own}"></div>`;
  }
  const p = slotData.poem;
  const c = S.color;
  const cls = 'card' + (S.opts.num ? '' : ' nonum');
  return `<div class="slot" data-idx="${index}" data-own="${own}">
    <button class="${cls}" data-num="${p.n}" data-own="${own}" data-idx="${index}"
      style="--c-base:${c.base};--c-dark:${c.dark};--c-ink:${c.ink}">
      <span class="num">${p.n}</span>
      <div class="shimo">
        <div class="line">${p.s[0]}</div>
        <div class="line">${p.s[1]}</div>
      </div>
    </button>
  </div>`;
}

function render(){
  myField.innerHTML = S.mySlots.map((item, i)=> slotHTML(item, 'me', i)).join('');
  cpuField.innerHTML = S.cpuSlots.map((item, i)=> slotHTML(item, 'cpu', i)).join('');
  myCountEl.textContent = S.myTakeCount;
  cpuCountEl.textContent = S.cpuTakeCount;
  hudDiffEl.textContent = S.diff.name;
  potText.textContent = S.pot > 0 ? ('（場のペナルティ札: ' + S.pot + '枚）') : '';
  myCountEl.classList.toggle('hot', S.phase === 'read');

  myRestTag.style.display = S.myRest ? 'inline-block' : 'none';
  cpuRestTag.style.display = S.cpuRest ? 'inline-block' : 'none';
}

function toast(msg,ms){
  toastEl.innerHTML=msg;toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>toastEl.classList.remove('show'),ms||2000);
}

/* ===== 進行バー ===== */
function startBar(ms){
  const t0=performance.now();
  cancelAnimationFrame(S.rafId);
  const tick=()=>{
    const left=1-(performance.now()-t0)/ms;
    barFill.style.transform='scaleX('+Math.max(0,left)+')';
    if(left>0&&!S.resolved)S.rafId=requestAnimationFrame(tick);
  };
  S.rafId=requestAnimationFrame(tick);
}
function stopBar(){cancelAnimationFrame(S.rafId);}

/* ===== ゲーム開始 ===== */
function start(){
  warmup();
  const pool=shuffle(S.color.poems.slice());
  
  S.mySlots = pool.slice(0,10).map(p => ({ poem: p, taken: false }));
  S.cpuSlots = pool.slice(10,20).map(p => ({ poem: p, taken: false }));
  
  S.order=shuffle(pool.slice());
  S.idx=0;S.resolved=true;S.phase='ready';
  S.pot=0; S.myTakeCount=0; S.cpuTakeCount=0;
  S.myRest=false; S.cpuRest=false; S.isSuddenDeath=false;
  
  clearTimeout(S.cpuTimer);clearTimeout(S.forceTimer);clearTimeout(S.waitTimer);clearInterval(S.memoTimer);
  stopBar();stopSpeak();

  setupScr.classList.remove('on');resultModal.classList.remove('on');gameScr.classList.add('on');
  render();

  phaseText.textContent='暗記時間';
  subText.textContent='';kamiText.textContent='暗記中';
  reader.classList.remove('done');
  
  readyOv.classList.add('on');
  setTimeout(()=>{
    readyOv.classList.remove('on');
    startMemo();
  },500);
}

/* ===== 暗記時間 ===== */
function startMemo(){
  S.phase='memo';
  let t=60;memoNum.textContent=t;
  memoBar.classList.add('on');

  clearInterval(S.memoTimer);
  S.memoTimer=setInterval(()=>{
    t--;memoNum.textContent=t;
    if(t<=0){
      clearInterval(S.memoTimer);
      begin();
    }
  },1000);
}
memoSkip.addEventListener('click',()=>{
  clearInterval(S.memoTimer);
  begin();
});

function begin(){
  memoBar.classList.remove('on');
  S.phase='read';
  render();
  nextPoem();
}

/* ===== 1首進行 ===== */
function nextPoem(){
  S.cur=S.order[S.idx];
  S.resolved=false;S.phase='read';
  
  phaseText.textContent = S.isSuddenDeath ? 'サドンデス' : ('第'+(S.idx+1)+'首／17首');

  const k=S.cur.k.join('');
  kamiText.textContent=k;
  subText.textContent='';
  subText.style.opacity='0';
  reader.classList.toggle('hide',!S.opts.kami);
  reader.classList.remove('done');
  replayBtn.disabled=false;

  render();

  if(S.myRest && S.cpuRest) toast('【双方 1回休み】', 1400);
  else if(S.myRest) toast('【自分 1回休み】', 1400);
  else if(S.cpuRest) toast('【相手 1回休み】', 1400);

  speakPoem(S.cur, ()=>{ checkAutoAdvance(); });

  if(!S.cpuRest){
    const d=S.diff;
    const ms=Math.max(400, d.react+(Math.random()*2-1)*d.jitter);
    clearTimeout(S.cpuTimer);
    S.cpuTimer=setTimeout(cpuAct,ms);
    startBar(ms);
  }else{
    startBar(18000);
  }

  clearTimeout(S.forceTimer);
  S.forceTimer=setTimeout(forceResolve, 18000);
}

replayBtn.addEventListener('click',()=>{
  if(S.cur&&S.phase==='read'&&!S.resolved){
    speakPoem(S.cur, ()=>{ checkAutoAdvance(); });
  }
});

/* ===== CPUの動作 ===== */
function cpuAct(){
  if(S.resolved||S.phase!=='read'||S.cpuRest)return;
  
  if(Math.random()<S.diff.err){
    penaltyFrom('cpu');
    return;
  }

  let targetSlot = S.mySlots.find(s => !s.taken && s.poem.n === S.cur.n);
  let own = 'me';
  if(!targetSlot){
    targetSlot = S.cpuSlots.find(s => !s.taken && s.poem.n === S.cur.n);
    own = 'cpu';
  }

  if(targetSlot){
    takeCard(S.cur.n, own, 'cpu');
  }
}

/* ===== お手つき処理 ===== */
function penaltyFrom(tapper){
  const isMe = (tapper === 'me');

  if(isMe) S.myRest = true; 
  else S.cpuRest = true;

  const takeCnt = isMe ? S.myTakeCount : S.cpuTakeCount;
  if(takeCnt > 0){
    if(isMe) S.myTakeCount--; 
    else S.cpuTakeCount--;
    S.pot++;
  }

  let msg = isMe 
    ? 'お手つき！次の1首は【1回休み】です。' 
    : '相手がお手つき！次の1首は相手が【1回休み】です。';

  toast(msg, 2400);
  render();
}

/* ===== 札取り実行 ===== */
function takeCard(n, owner, taker){
  if(S.resolved) return;
  
  const isMe = (taker === 'me');

  if(isMe && S.myRest){
    toast('【1回休み中】この首は札を取れません', 1200);
    return;
  }

  S.resolved=true;S.phase='read';
  clearTimeout(S.cpuTimer);clearTimeout(S.forceTimer);stopBar();replayBtn.disabled=true;

  const slots = owner==='me'? S.mySlots : S.cpuSlots;
  const slotObj = slots.find(s => !s.taken && s.poem.n === n);
  if(!slotObj) return;

  const card = slotObj.poem;
  const el = document.querySelector(`.card[data-num="${n}"]`);
  if(el) el.classList.add('hit');

  if(isMe) S.myRest = false; else S.cpuRest = false;

  let gained = 1;
  let bonusTxt = '';
  if(S.pot > 0){
    gained += S.pot;
    bonusTxt = `<br><small>（ペナルティの場札 ${S.pot} 枚もまとめて獲得！）</small>`;
    S.pot = 0;
  }

  if(isMe) S.myTakeCount += gained;
  else S.cpuTakeCount += gained;

  subText.textContent='下の句 '+card.s[0]+' '+card.s[1];
  subText.style.opacity = '1';
  reader.classList.add('done');
  reader.classList.remove('hide');

  toast((isMe ? '自分が取りました！' : '相手が取りました！') + bonusTxt, 1800);

  setTimeout(()=>{
    slotObj.taken = true;
    render();
  },500);

  checkAutoAdvance();
}

/* ===== 誰も取れなかった場合（時間切れ） ===== */
function forceResolve(){
  if(S.resolved||!S.cur)return;
  S.resolved=true;S.phase='read';
  clearTimeout(S.cpuTimer);stopBar();replayBtn.disabled=true;
  
  const n=S.cur.n;
  let slotObj = S.mySlots.find(s => !s.taken && s.poem.n === n);
  if(!slotObj) slotObj = S.cpuSlots.find(s => !s.taken && s.poem.n === n);

  if(slotObj){
    const el = document.querySelector(`.card[data-num="${n}"]`);
    if(el) el.classList.add('dim');

    subText.textContent='下の句 '+slotObj.poem.s[0]+' '+slotObj.poem.s[1];
    subText.style.opacity = '1';
    reader.classList.add('done');
    toast('時間切れ… この札は誰も取れませんでした',1600);

    setTimeout(()=>{
      slotObj.taken = true;
      render();
    },600);
  }

  checkAutoAdvance();
}

/* ===== 自動進行 ===== */
function checkAutoAdvance(){
  if(!S.resolved || !S.speechEnded) return;

  clearTimeout(S.waitTimer);
  S.waitTimer = setTimeout(()=>{
    advanceNext();
  }, 2000);
}

function advanceNext(){
  S.myRest = false;
  S.cpuRest = false;

  if(!S.isSuddenDeath && S.idx >= 16){
    if(S.myTakeCount !== S.cpuTakeCount) return finish();
    else {
      S.isSuddenDeath = true;
      S.idx++;
      if(S.idx >= S.order.length) return finish();
      toast('同点のため、サドンデス（1首勝負）に入ります！', 2200);
      setTimeout(nextPoem, 1200);
      return;
    }
  }else if(S.isSuddenDeath){
    if(S.myTakeCount !== S.cpuTakeCount) return finish();
    else {
      S.idx++;
      if(S.idx >= S.order.length) return finish();
      nextPoem();
      return;
    }
  }

  S.idx++;
  if(S.idx >= S.order.length) finish();
  else nextPoem();
}

/* ===== タップ処理 ===== */
function onTap(e){
  const el=e.target.closest?e.target.closest('.card'):null;
  if(!el||S.phase!=='read'||S.resolved||!S.cur)return;

  if(S.myRest){
    toast('【1回休み中】この首は札を取れません', 1200);
    return;
  }

  const n=parseInt(el.dataset.num,10);
  const owner=el.dataset.own;

  if(n===S.cur.n){
    takeCard(n,owner,'me');
    return;
  }

  el.classList.add('bad');
  setTimeout(()=>el.classList.remove('bad'),450);
  penaltyFrom('me');
}
myField.addEventListener('click',onTap);
cpuField.addEventListener('click',onTap);

/* ===== 勝敗結果表示＆履歴保存 ===== */
function finish(){
  S.phase='over';S.resolved=true;
  clearTimeout(S.cpuTimer);clearTimeout(S.forceTimer);clearTimeout(S.waitTimer);clearInterval(S.memoTimer);
  stopBar();stopSpeak();
  memoBar.classList.remove('on');

  const m=S.myTakeCount, c=S.cpuTakeCount;
  let v, why, resFlag;

  if(m > c){
    v = '勝利！';
    why = S.isSuddenDeath ? 'サドンデスで勝利！' : '17首終了時、獲得枚数が多いため勝利！';
    resFlag = 'WIN';
  }else if(m < c){
    v = '敗北…';
    why = S.isSuddenDeath ? 'サドンデスで敗北。' : '17首終了時、相手の獲得枚数が多いため敗北。';
    resFlag = 'LOSE';
  }else{
    v = '引き分け';
    why = '全ての札を読み終え、完全同点でした。';
    resFlag = 'DRAW';
  }

  $('mVerdict').textContent = v;
  $('mWhy').textContent = why;
  $('mMy').textContent = m;
  $('mCpu').textContent = c;

  const now = new Date();
  const dateStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  saveHistoryItem({
    date: dateStr, color: S.color.name, diff: S.diff.name,
    my: m, cpu: c, res: resFlag
  });

  resultModal.classList.add('on');
}

/* 中断処理 */
quitBtn.addEventListener('click',()=>{
  if(confirm('対戦を中断して設定画面に戻りますか？')){
    S.phase='idle';S.resolved=true;
    clearTimeout(S.cpuTimer);clearTimeout(S.forceTimer);clearTimeout(S.waitTimer);clearInterval(S.memoTimer);
    stopBar();stopSpeak();
    memoBar.classList.remove('on');
    gameScr.classList.remove('on');
    setupScr.classList.add('on');
  }
});

/* ===== モーダルボタンイベント ===== */
$('mAgainBtn').addEventListener('click', ()=>{
  resultModal.classList.remove('on');
  start();
});
$('mBackBtn').addEventListener('click', ()=>{
  stopSpeak();
  resultModal.classList.remove('on');
  gameScr.classList.remove('on');
  setupScr.classList.add('on');
});

$('startBtn').addEventListener('click',()=>{
  warmup();
  start();
});
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>

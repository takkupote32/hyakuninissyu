<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>五色百人一首 かるた対戦</title>
<style>
:root{
  --bg:#0d1420; --line:rgba(255,255,255,.10);
  --gold:#d9b46a; --ink:#f3efe6; --dim:#96a2b8;
  --c-base:#2f6fb3; --c-dark:#16416f; --c-ink:#fff;
  --fs:clamp(10px, 3.2vw, 15px); --radius:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;}
body{
  background:radial-gradient(125% 85% at 50% -10%, #1d2a44 0%, var(--bg) 58%, #06090f 100%);
  color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,-apple-system,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  font-feature-settings:"palt" 0;
}
.screen{display:none;height:100svh;height:100dvh;width:100%;flex-direction:column;}
.screen.on{display:flex;}

/* ===== 設定画面 ===== */
#setup{
  padding:calc(12px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
  gap:10px;overflow-y:auto;
}
.brand{text-align:center;padding:4px 0 2px;}
.brand h1{margin:0;font-size:26px;letter-spacing:.20em;font-weight:700;
  background:linear-gradient(180deg,#f8ecc9 0%,#d9b46a 55%,#a8823f 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.brand p{margin:4px 0 0;font-size:12px;color:var(--dim);letter-spacing:.14em;}
.sec{margin-top:4px;}
.sec>h2{font-size:12px;color:var(--gold);letter-spacing:.16em;margin:10px 0 6px;font-weight:600;}
.sec>h2 small{color:var(--dim);letter-spacing:0;font-weight:400;margin-left:6px;font-size:10.5px;}
.colors{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.cbtn{
  border:0;border-radius:var(--radius);padding:10px 0 8px;cursor:pointer;
  color:#fff;font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.1em;
  box-shadow:0 3px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.32);
  position:relative;transition:transform .12s, outline-color .12s;
  outline:3px solid transparent;outline-offset:2px;
}
.cbtn:active{transform:translateY(2px);}
.cbtn .cnt{display:block;font-size:9px;opacity:.85;letter-spacing:0;margin-top:2px;font-weight:500;}
.cbtn.sel{outline-color:var(--gold);}
.diffs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.dbtn{
  border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--ink);
  border-radius:var(--radius);padding:9px 2px;font-family:inherit;font-size:11.5px;font-weight:600;
  cursor:pointer;letter-spacing:.02em;transition:all .15s;
}
.dbtn span{display:block;font-size:8.5px;color:var(--dim);font-weight:400;margin-top:2px;}
.dbtn.sel{background:linear-gradient(180deg,rgba(217,180,106,.30),rgba(217,180,106,.13));
  border-color:var(--gold);color:#f8ecc9;}
.dbtn.sel span{color:#d9c39a;}
.note{
  font-size:11px;color:#c8bfa8;background:rgba(217,180,106,.09);
  border-left:2px solid var(--gold);border-radius:0 6px 6px 0;padding:7px 10px;margin-top:6px;line-height:1.5;
}
.opts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.chk{
  display:flex;align-items:center;gap:5px;font-size:11px;color:#cfd6e2;
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:20px;padding:6px 10px;cursor:pointer;
}
.chk.on{background:rgba(217,180,106,.18);border-color:rgba(217,180,106,.5);color:#f4e6c6;}
.chk input{display:none;}
#startBtn{
  margin-top:12px;width:100%;border:0;border-radius:12px;padding:15px;font-family:inherit;
  font-size:16px;font-weight:700;letter-spacing:.2em;color:#251c07;cursor:pointer;
  background:linear-gradient(180deg,#f2dda6,#d9b46a 60%,#bb9247);
  box-shadow:0 5px 16px rgba(217,180,106,.28), inset 0 1px 0 rgba(255,255,255,.7);
}
#startBtn:active{transform:translateY(2px);}
.ghost{
  margin-top:8px;width:100%;border:1px solid var(--line);background:transparent;color:var(--dim);
  border-radius:10px;padding:10px;font-family:inherit;font-size:11px;cursor:pointer;
}

/* 履歴セクション */
.history-sec{margin-top:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:12px;}
.history-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.history-hdr h3{margin:0;font-size:12px;color:var(--gold);font-weight:600;}
.clear-btn{border:1px solid rgba(255,107,107,.4);background:rgba(255,107,107,.1);color:#ff9f6b;border-radius:12px;padding:2px 8px;font-size:10px;cursor:pointer;}
.hist-list{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto;}
.hist-item{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:8px;font-size:10.5px;padding:6px 8px;background:rgba(255,255,255,.04);border-radius:6px;border:1px solid rgba(255,255,255,.05);}
.hist-item .win{color:#7de08a;font-weight:700;}
.hist-item .lose{color:#ff6b6b;font-weight:700;}
.hist-item .draw{color:var(--dim);font-weight:700;}
.hist-del{border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:11px;padding:0 2px;}

/* ===== 対戦画面 ===== */
#game{
  padding:calc(4px + env(safe-area-inset-top)) 6px calc(6px + env(safe-area-inset-bottom));
  gap:4px;height:100svh;height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;
}
.hud{
  display:grid;grid-template-columns:auto 1fr auto 1fr;align-items:center;gap:6px;
  font-size:11px;padding:2px 4px;flex:0 0 auto;
}
.hud .quit-btn{
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--dim);
  border-radius:14px;padding:4px 9px;font-size:10px;cursor:pointer;font-family:inherit;
  white-space:nowrap;transition:background .15s;
}
.hud .quit-btn:active{background:rgba(255,255,255,.18);color:#fff;}
.hud .side{display:flex;align-items:center;gap:4px;color:var(--dim);}
.hud .side.r{justify-content:flex-end;}
.hud b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;}
.hud b.hot{color:#ff9f6b;}
.hud .mid{
  font-size:10.5px;color:var(--gold);letter-spacing:.06em;text-align:center;
  border:1px solid rgba(217,180,106,.35);border-radius:20px;padding:3px 8px;white-space:nowrap;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.hud .pot-info{font-size:8.5px;color:#ff9f6b;margin-top:1px;}

.field{
  display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);
  gap:5px;flex:1 1 0;min-height:0;width:100%;align-items:stretch;justify-items:stretch;
}
.field.cpu{transform:rotate(180deg);}

.slot{
  width:100%;height:100%;min-height:0;position:relative;
}
.card{
  position:absolute;inset:0;border:0;padding:2px;border-radius:6px;overflow:hidden;cursor:pointer;
  background:linear-gradient(160deg,var(--c-base),var(--c-dark));
  box-shadow:0 2px 5px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;
  font-family:inherit;transition:transform .08s ease-out, box-shadow .15s, opacity .25s;
  touch-action:manipulation;
}
.card::after{content:"";position:absolute;inset:2px;border-radius:4px;
  border:1px solid rgba(255,255,255,.18);pointer-events:none;}
.card .num{
  position:absolute;left:3px;top:2px;font-size:8px;color:var(--c-ink);opacity:.6;
  line-height:1;letter-spacing:0;pointer-events:none;
}
.card .shimo{
  writing-mode:vertical-rl;display:flex;flex-direction:row-reverse;
  justify-content:center;align-items:center;gap:4px;height:92%;margin:0 auto;color:var(--c-ink);
  pointer-events:none;
}
.card .shimo span{
  display:block;white-space:nowrap;font-size:clamp(10px, 3.4vw, 15px);
  line-height:1.12;letter-spacing:0.04em;font-weight:600;pointer-events:none;
}
.slot.taken .card{display:none;}
.slot.taken::before{
  content:"";position:absolute;inset:0;border-radius:6px;
  border:1px dashed rgba(255,255,255,.08);background:rgba(0,0,0,.12);
}

.card:active:not(.empty){transform:scale(.94);}
.card.hit{animation:hit .45s ease-out;box-shadow:0 0 0 3px #7de08a, 0 0 22px rgba(125,224,138,.7);}
.card.bad{animation:bad .45s ease-out;box-shadow:0 0 0 3px #ff6b6b, 0 0 22px rgba(255,107,107,.7);}
.card.dim{opacity:.25;}
@keyframes hit{0%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes bad{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.card.nonum .num{display:none;}

/* 朗詠＆暗記バー領域（お互いの札の間） */
.reader{
  flex:0 0 auto;border-radius:10px;padding:4px 10px;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.028));
  border:1px solid var(--line);min-height:64px;
  display:flex;flex-direction:column;justify-content:center;gap:2px;position:relative;overflow:hidden;
}
.reader .lbl{font-size:8.5px;color:var(--dim);letter-spacing:.32em;}
.reader .kami{font-size:14.5px;font-weight:600;letter-spacing:.06em;line-height:1.45;word-break:break-all;}
.reader .sub{font-size:10px;color:#8fa8c4;letter-spacing:.05em;min-height:13px;line-height:1.3;transition:opacity .3s;}
.reader.hide .kami{filter:blur(7px);opacity:.55;}
.reader.done .kami{color:var(--gold);}
.reader .rep{position:absolute;right:6px;top:5px;border:1px solid var(--line);background:rgba(255,255,255,.07);
  color:#cbd4e2;border-radius:14px;font-family:inherit;font-size:9px;padding:3px 7px;cursor:pointer;letter-spacing:.02em;}
.reader .rep:active{transform:scale(.94);}
.reader .rep[disabled]{opacity:.3;}
.bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:rgba(255,255,255,.09);}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7de08a,#d9b46a,#ff6b6b);
  transform-origin:left center;transform:scaleX(1);}

/* ===== 横長コンパクト暗記UI（朗詠バー内にインライン配置） ===== */
.memo-inline{
  display:none;align-items:center;justify-content:space-between;width:100%;height:100%;padding:0 4px;
}
.memo-inline.on{display:flex;}
.memo-inline .left-box{display:flex;align-items:center;gap:8px;}
.memo-inline .time-num{font-size:22px;font-weight:800;color:#f8ecc9;font-variant-numeric:tabular-nums;line-height:1;}
.memo-inline .time-txt{font-size:10px;color:var(--dim);text-align:left;line-height:1.2;}
.memo-inline .skip-btn{
  border:0;border-radius:8px;padding:6px 14px;font-family:inherit;font-size:11.5px;font-weight:700;
  color:#251c07;background:linear-gradient(180deg,#f2dda6,#d9b46a);cursor:pointer;white-space:nowrap;
  box-shadow:0 2px 6px rgba(0,0,0,.3);touch-action:manipulation;
}
.memo-inline .skip-btn:active{transform:scale(.95);}

.toast{
  position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.85);
  background:rgba(8,12,20,.94);border:1px solid var(--line);color:#fff;padding:12px 22px;border-radius:12px;
  font-size:13px;font-weight:700;letter-spacing:.08em;opacity:0;pointer-events:none;transition:all .2s;z-index:95;
  white-space:nowrap;backdrop-filter:blur(6px);text-align:center;line-height:1.4;
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

/* ===== 対戦結果ポップアップ ===== */
.modal-ov{
  position:fixed;inset:0;background:rgba(4,7,12,0.85);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-ov.on{display:flex;}
.modal-box{
  background:linear-gradient(180deg,#18253d,#0d1420);border:1px solid var(--gold);
  border-radius:20px;padding:24px 20px;width:100%;max-width:340px;text-align:center;
  box-shadow:0 12px 32px rgba(0,0,0,.8);animation:modalUp .3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
}
@keyframes modalUp{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal-box .verdict{
  font-size:36px;font-weight:800;letter-spacing:.15em;margin-bottom:4px;
  background:linear-gradient(180deg,#f8ecc9,#d9b46a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.modal-box .why{font-size:11.5px;color:var(--dim);margin-bottom:16px;line-height:1.5;}
.scorebox{
  display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:16px;
}
.scorebox .n{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;}
.scorebox .t{font-size:10px;color:var(--dim);margin-top:2px;}
.scorebox .vs{font-size:10px;color:var(--gold);font-weight:700;}
.modal-btns{display:flex;flex-direction:column;gap:8px;}
.modal-btn-main{
  border:0;border-radius:12px;padding:13px;font-family:inherit;font-size:14px;font-weight:700;
  color:#251c07;background:linear-gradient(180deg,#f2dda6,#d9b46a);cursor:pointer;letter-spacing:.1em;
}
.modal-btn-sub{
  border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);
  border-radius:12px;padding:11px;font-family:inherit;font-size:12px;cursor:pointer;
}

.ov{position:fixed;inset:0;background:rgba(5,8,13,.93);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:80;padding:24px;text-align:center;}
.ov.on{display:flex;}
.spin{width:40px;height:40px;border-radius:50%;border:3px solid rgba(217,180,106,.22);
  border-top-color:var(--gold);animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}

@media (min-width:600px){
  :root{--fs:14px;}
  .screen{max-width:480px;margin:0 auto;}
}
</style>
</head>
<body>

<!-- ========== 設定 ========== -->
<section id="setup" class="screen on">
  <div class="brand">
    <h1>五色百人一首</h1>
    <p>かるた対戦</p>
  </div>

  <div class="sec">
    <h2>色を選ぶ <small>20枚 ずつ</small></h2>
    <div class="colors" id="colorpick"></div>
  </div>

  <div class="sec">
    <h2>相手の強さ</h2>
    <div class="diffs" id="diffpick"></div>
    <div class="note" id="diffNote"></div>
  </div>

  <div class="sec">
    <h2>設定</h2>
    <div class="opts">
      <label class="chk" id="chkNum"><input type="checkbox" id="cbNum">札に番号を表示</label>
      <label class="chk on" id="chkKami"><input type="checkbox" id="cbKami" checked>上の句を表示</label>
      <label class="chk on" id="chkVoice"><input type="checkbox" id="cbVoice" checked>音声で読み上げ</label>
      <label class="chk" id="chkSlow"><input type="checkbox" id="cbSlow">ゆっくり詠む</label>
    </div>
  </div>

  <!-- 対戦履歴 -->
  <div class="history-sec">
    <div class="history-hdr">
      <h3>対戦履歴（最新10件）</h3>
      <button class="clear-btn" id="clearHistBtn">全リセット</button>
    </div>
    <div class="hist-list" id="histList">
      <div style="font-size:10px;color:var(--dim);text-align:center;padding:10px;">履歴はありません</div>
    </div>
  </div>

  <button id="startBtn">対 戦 ス タ ー ト</button>
  <button id="voiceTest" class="ghost">🔊 読み上げの音声テスト</button>
</section>

<!-- ========== 対戦 ========== -->
<section id="game" class="screen">
  <div class="hud">
    <button class="quit-btn" id="quitBtn">✕ 中断</button>
    <div class="side"><span>相手</span> <b id="cpuCount">0</b><span>枚</span></div>
    <div class="mid">
      <span id="phaseText">準備</span>
      <span id="potText" class="pot-info"></span>
    </div>
    <div class="side r"><span>自分</span> <b id="myCount" class="hot">0</b><span>枚</span></div>
  </div>

  <div class="field cpu" id="cpuField"></div>

  <!-- 朗詠・暗記バー（お互いの札の間） -->
  <div class="reader" id="reader">
    <!-- 対戦時の朗詠表示 -->
    <div id="readContent">
      <div class="lbl">上 の 句</div>
      <div class="kami" id="kamiText">―</div>
      <div class="sub" id="subText"></div>
      <button class="rep" id="replayBtn" aria-label="もう一度聞く">↻ もう一度</button>
    </div>

    <!-- 暗記時間中の横長コンパクト表示 -->
    <div class="memo-inline" id="memoInline">
      <div class="left-box">
        <div class="time-num" id="memoNum">60</div>
        <div class="time-txt">秒<br>札の位置を覚えよう</div>
      </div>
      <button class="skip-btn" id="memoSkip">覚えた！</button>
    </div>

    <div class="bar"><i id="barFill"></i></div>
  </div>

  <div class="field me" id="myField"></div>
</section>

<!-- 対戦結果モーダル -->
<div class="modal-ov" id="resultModal">
  <div class="modal-box">
    <div class="verdict" id="mVerdict">勝利！</div>
    <div class="why" id="mWhy">17首終了時、獲得枚数が多いため勝利しました！</div>
    <div class="scorebox">
      <div><div class="n" id="mMy">0</div><div class="t">自分</div></div>
      <div class="vs">VS</div>
      <div><div class="n" id="mCpu">0</div><div class="t">相手</div></div>
    </div>
    <div class="modal-btns">
      <button class="modal-btn-main" id="mAgainBtn">もう一度対戦</button>
      <button class="modal-btn-sub" id="mBackBtn">設定画面に戻る</button>
    </div>
  </div>
</div>

<!-- 準備中オーバーレイ -->
<div class="ov" id="readyOv">
  <div class="spin"></div>
  <div style="font-size:12px;color:var(--dim);margin-top:10px;">札を並べています…</div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ====== 百人一首データ ====== */
const COLORS=[
{id:'ao',name:'青',base:'#2f6fb3',dark:'#12395e',ink:'#eaf4ff',poems:[
 {n:3,k:['あしびきの','やまどりのをの','しだりをの'],s:['ながながしよを','ひとりかもねむ']},
 {n:5,k:['おくやまに','もみぢふみわけ','なくしかの'],s:['こゑきくときぞ','あきはかなしき']},
 {n:6,k:['かささぎの','わたせるはしに','おくしもの'],s:['しろきをみれば','よぞふけにける']},
 {n:12,k:['あまつかぜ','くものかよひぢ','ふきとぢよ'],s:['をとめのすがた','しばしとどめむ']},
 {n:14,k:['みちのくの','しのぶもぢずり','たれゆゑに'],s:['みだれそめにし','われならなくに']},
 {n:24,k:['このたびは','ぬさもとりあへず','たむけやま'],s:['もみぢのにしき','かみのまにまに']},
 {n:30,k:['ありあけの','つれなくみえし','わかれより'],s:['あかつきばかり','うきものはなし']},
 {n:31,k:['あさぼらけ','ありあけのつきと','みるまでに'],s:['よしののさとに','ふれるしらゆき']},
 {n:50,k:['きみがため','をしからざりし','いのちさへ'],s:['ながくもがなと','おもひけるかな']},
 {n:57,k:['めぐりあひて','みしやそれとも','わかぬまに'],s:['くもがくれにし','よはのつきかな']},
 {n:61,k:['いにしへの','ならのみやこの','やへざくら'],s:['けふここのへに','にほひぬるかな']},
 {n:62,k:['よをこめて','とりのそらねは','はかるとも'],s:['よにあふさかの','せきはゆるさじ']},
 {n:69,k:['あらしふく','みむろのやまの','もみぢばは'],s:['たつたのかはの','にしきなりけり']},

### 変更のポイント
1. **暗記タイマーを「札の間（朗詠エリア）」へコンパクトに統合**
   * ポップアップが消え、お互いの札の間の朗詠エリア内に**横一列（タイム・説明文・「覚えた！」ボタン）**で収まるようになりました。札が一切隠れなくなります。
2. **タップ感度・レスポンスの最適化**
   * CSSに `touch-action: manipulation;` を適用し、モバイルでのダブルタップ遅延を防止。
   * タッチイベントに `pointerdown` を使用することで、画面に指が触れた瞬間に超高速で取り判定が行われるように調整しました。
